items:
    - title: package.json's main field (dist/pluggable-exp
      id: AYlt
      date: "2026-08-08"
      tags:
        - type:ambiguity
        - plan/phase:framework-rename
        - plan/slug:modernization-foundation
        - priority:unspecified
        - effort:unspecified
      text: 'package.json''s main field (dist/pluggable-express.js) and the generated make/50-plugable-express-js.mk still reference the double-g dist filename. Investigated 2026-08-08: the fragment''s header claims it was generated by @liquid-labs/catalyst-builder-node, but that package 404s on npm and isn''t present anywhere in the playground or declared as a dependency — it cannot be re-run. A candidate replacement, @sdlcforge/gen-make, was dry-run tested and is NOT compatible: different file-naming scheme (would write 50-pluggable-express.mk, not 50-plugable-express-js.mk), different macro conventions, requires three new devDependencies not installed, and flags all six existing make/*.mk fragments as unrecognized (would need a disruptive --force-reset). package.json''s main field was deliberately left unchanged (dist/pluggable-express.js) since it still matches what the unregenerated Makefile fragment actually builds — repointing it now would create a new mismatch. Needs a manager/human decision: either locate the real generator''s provenance, or deliberately hand-edit the Makefile fragment''s double-g identifiers to single-g and update main to match.'
